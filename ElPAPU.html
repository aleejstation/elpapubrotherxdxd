/* Pantalla de entrada */
#gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;background:rgba(223,230,223,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity 1s ease,visibility 1s}

#gate .t{font-family:'Playfair Display',serif;font-size:.95rem;letter-spacing:.25em;text-transform:uppercase;color:#c8283f;border:1px solid #c8283f;border-radius:999px;padding:8px 22px;background:rgba(255,255,255,.15)}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
/* Flores */
.fl{position:fixed;z-index:0;pointer-events:none;width:min(100vw,560px);height:auto;opacity:0;transition:opacity 2.6s ease,transform 2.6s cubic-bezier(.2,.8,.2,1)}
.ftop{top:0;right:0;transform:translate(34px,-34px) scale(.95);transform-origin:top right;-webkit-mask-image:linear-gradient(to bottom,#000 82%,transparent),linear-gradient(to right,transparent,#000 10%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,#000 82%,transparent),linear-gradient(to right,transparent,#000 10%);mask-composite:intersect}
.fbot{bottom:0;left:0;transform:translate(-34px,34px) scale(.95);transform-origin:bottom left;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 14%),linear-gradient(to left,transparent,#000 14%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent,#000 14%),linear-gradient(to left,transparent,#000 14%);mask-composite:intersect}
.bloom .fl{opacity:1;transform:none}
.bloom .fbot{transition-delay:.5s}

.petal{position:fixed;top:-30px;z-index:4;pointer-events:none;width:14px;height:18px;border-radius:70% 0 70% 0;opacity:.42;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(60px,110vh,0) rotate(540deg)}}

/* Animaciones de texto */
.ch{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(14px)}
.bloom .ch{animation:chIn 1.3s ease forwards;animation-delay:calc(var(--i)*.22s + 1.1s)}
@keyframes chIn{to{opacity:1;filter:blur(0);transform:none}}
.fade{opacity:0}
.bloom .fade{animation:fadeIn 2s ease forwards;animation-delay:var(--d,3s)}
@keyframes fadeIn{to{opacity:1}}
.rv{opacity:0;transform:translateY(28px);transition:opacity 1.2s ease,transform 1.2s ease;transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

.gallery{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:24px;margin-top:20px}
.pol{background:#fffaf0;padding:10px 10px 14px;width:min(100%,250px);box-shadow:0 8px 20px rgba(74,42,48,.28);transform:rotate(var(--r,0deg));transition:transform .4s;color:#4a2a30}
.pol.wide{width:min(100%,340px)}
.pol:hover{transform:rotate(0) scale(1.04)}
.pol img{width:100%;display:block;border:1px solid #e6d6bd}
.pol p{margin:10px 0 0;font-family:'Playfair Display',serif;font-style:italic;font-size:1rem}
.pol.rv{transition:opacity 1.2s ease var(--d,0s),transform 1.2s ease var(--d,0s)}
.pol.rv.in{transform:rotate(var(--r,0deg));transition:opacity 1.2s ease var(--d,0s),transform .4s ease}
.pol.rv.in:hover{transform:rotate(0) scale(1.04)}
.hrt{position:fixed;top:-50px;z-index:4;pointer-events:none;opacity:.42;animation:hfall linear infinite}
.hrt span{display:block;animation:hbeat 1.3s ease-in-out infinite;text-shadow:0 0 8px rgba(224,24,47,.35)}
@keyframes hfall{0%{transform:translate3d(0,0,0)}25%{transform:translate3d(24px,28vh,0)}50%{transform:translate3d(-20px,58vh,0)}75%{transform:translate3d(22px,86vh,0)}100%{transform:translate3d(0,118vh,0)}}
@keyframes hbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.hrt{display:none}}
@media (prefers-reduced-motion:reduce){.ch,.fade,.rv{opacity:1;filter:none;transform:none;animation:none!important;transition:none}}
.qr{display:block;width:min(100%,300px);margin:18px auto 20px;border-radius:14px;box-shadow:0 8px 20px rgba(20,35,40,.3)}
a.seal{display:inline-block;text-decoration:none;background:var(--wine);color:var(--on);border-radius:999px;padding:12px 26px;font-weight:600}

Hay tantas cosas que quisiera decirte que a veces siento que las palabras se quedan pequeñas para todo lo que llevo dentro. Y es curioso, porque antes de conocerte jamás imaginé que una persona pudiera llegar a significar tanto para mí, que su nombre pudiera convertirse en uno de mis pensamientos favoritos y que su existencia pudiera hacerme mirar la vida de una manera distinta.

A veces me pongo a pensar en lo extraño y maravilloso que es el destino. Pienso en todas las cosas que tuvieron que suceder para que tú y yo coincidiéramos, en todas las decisiones, los días y los momentos que, sin saberlo, nos estaban acercando. Y me parece increíble que, entre millones de personas, haya tenido la oportunidad de conocerte a ti. No sé si fue suerte, casualidad o algo que la vida tenía preparado, pero si pudiera volver atrás y recorrer todos esos días otra vez, desearía que cada camino me llevara nuevamente hasta ti.

¿Sabes qué es lo que más me gusta de quererte? Que no se trata solamente de lo feliz que me haces. Se trata de que quiero conocerte incluso en esas partes de ti que no siempre muestras, entender tus silencios, escuchar esas historias que quizá nunca le has contado a nadie, descubrir qué cosas te emocionan, qué recuerdos guardas con cariño y cuáles son esos pequeños detalles que hacen que seas tú.

No quiero enamorarme únicamente de tus días bonitos, Camila. Quiero aprender a quererte también cuando las cosas no salgan como esperabas, cuando tengas mil pensamientos en la cabeza o cuando simplemente no encuentres las palabras para explicar cómo te sientes. Porque para mí amar no significa encontrar a alguien que siempre esté bien, sino elegir a una persona real, con todo lo que es, y querer seguir conociéndola cada día.

Y hay algo que me parece especialmente hermoso: pensar que todavía somos dos personas que tienen muchísimo por descubrir la una de la otra. Todavía existen conversaciones que no hemos tenido, lugares a los que no hemos ido, canciones que algún día nos recordarán momentos juntos y recuerdos que, aunque hoy no existen, quizá algún día serán de nuestros favoritos.

Hoy, 29 de octubre, cumplimos nuestro primer mes de novios. Y aunque para el mundo un mes pueda parecer poco tiempo, para mí tiene un significado que no podría explicar con un simple número. Porque no se trata de cuántos días han pasado, sino de todo lo que has despertado en mí durante ellos.

Pero también hay algo que quisiera confiarte, mi amor. Algo que nace precisamente de lo mucho que significas para mí.

Quisiera que, mientras seguimos construyendo esta historia, ninguno de los dos se olvide de cuidar lo que tenemos. Que no permitamos que la costumbre, las ocupaciones o la distancia de algunos días nos hagan olvidar lo importante que es hacernos sentir presentes en la vida del otro. Porque creo que el amor no solamente se encuentra en los momentos en que podemos estar juntos, sino también en lo que hacemos cuando no podemos estarlo.

Sé que ambos tenemos nuestras propias vidas, responsabilidades, preocupaciones y momentos en los que necesitamos nuestro espacio, y jamás quisiera que sintieras que debes dejar de lado tu mundo por estar conmigo. Al contrario, quiero verte crecer, cumplir tus sueños y disfrutar de todo aquello que te hace feliz. Pero también quisiera que, dentro de ese mundo tan tuyo, siempre podamos encontrar un pequeño lugar para nosotros.

Y te confieso algo, Camila: a veces te extraño de una manera que no tiene tanto que ver con la distancia física. Hay momentos en los que quisiera contarte algo, escucharte o simplemente sentirte un poquito más cerca, y no siempre sé cómo expresarlo. No te lo digo para hacerte sentir culpable, ni porque espere que estés disponible a cada instante. Te lo digo porque contigo quiero aprender a hablar incluso de aquello que me cuesta decir.

No necesito que me dediques cada minuto de tu vida, mi amor. Solo quisiera que, así como yo pienso en maneras de acercarme a ti, tú también encuentres, cuando puedas, tus propias maneras de acercarte a mí. Que no siempre tengamos que esperar a que las circunstancias sean perfectas para buscarnos.

Porque a veces un mensaje inesperado, una pregunta sincera sobre cómo estuvo mi día o unos minutos que decidimos compartir pueden significar muchísimo. Son pequeños gestos que nos recuerdan que, aun cuando estamos ocupados viviendo nuestras propias vidas, seguimos pensando el uno en el otro.

Y si alguna vez me notas más callado, quisiera tener la confianza de explicarte lo que siento, así como quiero que tú tengas esa misma libertad conmigo. No quiero que aprendamos a adivinar nuestros sentimientos a través de silencios. Quiero que aprendamos a escucharnos, a entender nuestras diferencias y a encontrar maneras de querernos en las que ambos nos sintamos tranquilos.

**Quiero sentir que también soy alguien a quien buscas, no solamente alguien que siempre estará esperando encontrarte.** Y quiero que tú puedas sentir exactamente lo mismo de mi parte.

Hay algo más que quisiera que entendieras, mi amor. A veces me da miedo que, sin darnos cuenta, terminemos acostumbrándonos a que yo siempre esté ahí, esperando una oportunidad para hablarte, verte o compartir algo contigo. Porque aunque me nace buscarte y estar pendiente de ti, también tengo momentos en los que necesito sentir que tú deseas mi compañía tanto como yo deseo la tuya.

Quisiera que recuerdes que tienes un novio, Camila. No solamente una persona a la que puedes acudir cuando necesitas cariño, compañía o alguien que te escuche, sino alguien que también tiene sentimientos, que también extraña, que también tiene días difíciles y que, aunque a veces no lo diga, también necesita sentirse querido y acompañado.

Y quizás esto sea lo que más me cuesta confesarte: hay momentos en los que siento que estoy mucho más cerca de ti cuando tú me necesitas que cuando soy yo quien necesita tenerte cerca. Y aunque sé que probablemente no sea tu intención hacerme sentir así, no puedo negar que a veces me entristece. Porque hay días en los que no necesito grandes palabras ni demostraciones extraordinarias; simplemente quisiera sentir que te nace buscarme, preguntarme cómo estoy o hacerme un pequeño espacio en tu día.

No quiero que confundas estas palabras con un reclamo. Tampoco quiero que sientas que tienes una obligación conmigo. Lo que más deseo no es que estés presente porque te lo he pedido, sino que podamos construir una relación en la que a ambos nos nazca estar presentes. Porque no hay nada más bonito que saber que alguien piensa en ti sin que tengas que recordarle que existes.

Y si algún día las cosas se complican, si tenemos menos tiempo para vernos o si nuestras responsabilidades nos mantienen ocupados, quisiera que no olvidemos algo: una relación no se cuida solamente cuando sobra tiempo, también se cuida encontrando pequeñas maneras de estar presentes cuando el tiempo escasea. No siempre podremos vernos, no siempre podremos hablar durante horas, pero sí podemos intentar que el otro no se sienta olvidado.

Yo también quiero aprender a hacerlo mejor, Camila. Quiero escucharte cuando algo te incomode, comprender tus necesidades y reconocer cuando me equivoque. Porque no quiero pedirte algo que yo no esté dispuesto a ofrecerte.

No quiero ser una persona a la que recuerdes únicamente cuando necesitas algo. Quiero ser alguien con quien también quieras compartir tus alegrías, tus días normales, tus pensamientos más pequeños y hasta esos momentos en los que aparentemente no hay nada que contar.

Y sobre todo, quiero que sepas que decirte esto no significa que te ame menos. Significa que estoy siendo sincero contigo, porque lo que tenemos es demasiado importante para mí como para esconder mis sentimientos detrás de un «no pasa nada» cuando en realidad sí pasa.

No quiero que ninguno de los dos tenga que acostumbrarse a sentirse solo estando en una relación. Quiero que aprendamos a acompañarnos de verdad, a cuidarnos mutuamente y a recordar que el amor no consiste únicamente en tener a alguien que esté ahí para nosotros, sino también en preguntarnos si nosotros estamos estando ahí para esa persona.

Porque yo no quiero simplemente tener una novia, Camila. **Quiero que seamos dos personas que, aun teniendo una vida propia, encuentren en el otro un lugar al que les nazca volver.**

Y hay una última cosa que quisiera decirte, quizás una de las más importantes. Me encanta escucharte decir que me amas, y créeme que esas palabras tienen un valor inmenso para mí. Pero también quisiera sentirlas en tus acciones, en tus iniciativas, en esos pequeños gestos que nacen de ti sin que tenga que pedirlos. Porque yo intento demostrarte lo que siento de muchas maneras, no porque espere que hagas exactamente lo mismo, sino porque me nace hacerte sentir especial. Y a veces también quisiera experimentar esa sensación de saber que alguien está pensando en cómo hacerme sentir querido.

**No quiero solamente que me digas que me amas, Camila. Quiero poder reconocer ese amor en la manera en que me cuidas, me buscas y me haces sentir parte de tu vida, así como yo intento demostrártelo a ti.** No necesitamos amar de maneras idénticas, pero sí aprender a comprender cómo necesita sentirse amado el otro.

Y quisiera dejarte una pregunta. No tienes que responderla ahora, ni mañana, ni después, solo quiero que lo pienses de la manera mas sincera y con el corazón:

**¿Me amas por cómo te trato, por cómo te hago sentir y por la compañía que te doy, o me amas por ser Aaron?**

Por ser esa persona que está incluso cuando no tiene nada extraordinario que ofrecerte. Por mis pensamientos, mis sueños, mis inseguridades, mis defectos, mis días buenos y aquellos en los que no soy mi mejor versión. Por todo eso que me convierte en alguien único, más allá de lo que puedo hacer por ti.

Porque yo quiero que me conozcas y me quieras como persona, no solamente por el papel que cumplo en tu vida. Así como yo quiero conocerte y amarte por quien eres, incluso en esos momentos en los que no tienes nada que darme más que tu propia presencia.

Y si te digo todo esto, es porque quiero que lo nuestro crezca sobre algo más profundo que las palabras bonitas. Quiero que exista reciprocidad, comprensión y esa tranquilidad de saber que ninguno tiene que ganarse constantemente un lugar en el corazón del otro.

**No quiero que me ames por todo lo que puedo hacer por ti. Quiero que también me ames por todo lo que soy cuando no estoy haciendo nada por nadie.**

Porque antes de ser tu novio, soy Aaron. Y una de las cosas más bonitas que podría vivir a tu lado sería sentir que amas a ambos: al novio que intenta hacerte feliz y a la persona que existe detrás de todos esos intentos.

No te pido un amor perfecto, Camila. Te propongo uno en el que los dos podamos equivocarnos, hablar, aprender y volver a encontrarnos. Uno donde ninguno tenga que preguntarse constantemente si está siendo importante para el otro, porque nuestras acciones, incluso las más pequeñas, nos ayuden a recordarlo.

Y quiero que sepas que esto no disminuye ni un poquito la felicidad que siento por nuestro primer mes. Al contrario, te lo comparto porque lo nuestro me importa lo suficiente como para querer cuidarlo desde ahora. Porque para mí, amar también significa tener el valor de decir lo que sentimos, incluso cuando resulta difícil.

No quiero prometerte una historia perfecta, porque sería prometer algo que nadie puede asegurar. Pero sí quiero que sepas que mis sentimientos por ti son sinceros, que quiero aprender a construir algo bonito contigo y que no deseo que lo nuestro sea solamente una colección de fechas especiales. Quiero que también exista amor en los jueves aburridos, en las conversaciones sin sentido, en las risas inesperadas y en esos días comunes que, sin darnos cuenta, terminan convirtiéndose en recuerdos inolvidables.

A veces pienso en el futuro y me pregunto cómo seremos dentro de unos años, cuánto habremos cambiado, cuántas historias tendremos para contar. No tengo las respuestas, pero hay una imagen que me hace especialmente feliz: la de nosotros recordando este primer mes y dándonos cuenta de cuánto hemos vivido desde entonces.

Y si algún día vuelves a leer estas palabras, quiero que recuerdes algo: hubo un 29 de octubre en el que un chico llamado Aaron estaba profundamente enamorado de ti, intentando encontrar la manera de poner en palabras algo que ni él mismo terminaba de comprender por completo.

Y ojalá, cuando recuerdes a ese Aaron, también recuerdes que nunca quiso ser el centro de tu mundo, sino alguien con quien pudieras compartirlo. Alguien que quería acompañarte sin detenerte, quererte sin limitarte y construir contigo algo en lo que ambos pudiéramos sentirnos amados.

Porque eso eres para mí, Camila: alguien a quien no quiero terminar de descubrir nunca. Alguien con quien incluso lo desconocido me provoca ilusión.

**Feliz primer mes, mi niña hermosa.**

Te amo, pero sobre todo, me encanta la idea de seguir aprendiendo lo que significa amarte. Porque si algo he entendido durante este mes, es que conocerte fue un momento de mi vida, pero quererte se está convirtiendo en una de mis historias favoritas.

Y si pudiera pedirle algo a nuestra historia, sería que nunca nos falten las ganas de elegirnos, incluso cuando la vida nos mantenga ocupados. Que sepamos darnos espacio sin hacernos sentir ausentes, y que jamás dejemos de encontrar razones para acercarnos.

**Porque no quiero ser el único que cuide nuestra historia, ni quiero que tú tengas que hacerlo sola. Quiero que algún día podamos mirar atrás y decir que lo nuestro fue bonito porque ambos decidimos hacerlo bonito.**

**Con todo mi amor, Aaron. ❤️**`,
  motivos: ["Tus ojos hermosos","El sudor de tus manos cuando estamos agarrados","Cuando acaricias mi cara","Tus besos"],
  sorpresa: "Te quiero muchísimo, Camila. ¡Feliz primer mes! 💕"
};

(function(){
  const box = document.getElementById('letter');
  CONFIG.carta.trim().split(/\n\s*\n/).forEach(par => {
    const p = document.createElement('p');
    par.split(/(\*\*[^*]+\*\*)/).forEach(seg => {
      if(!seg) return;
      if(seg.startsWith('**') && seg.endsWith('**')){ const b = document.createElement('strong'); b.textContent = seg.slice(2,-2); p.appendChild(b); }
      else p.appendChild(document.createTextNode(seg));
    });
    box.appendChild(p);
  });
})();
const ul = document.getElementById('reasons');
CONFIG.motivos.forEach(m => { const li = document.createElement('li'); li.textContent = '❀ ' + m; ul.appendChild(li); });


// Nombres que aparecen letra por letra
(function(){
  const h = document.getElementById('names');
  const txt = CONFIG.de + ' & ' + CONFIG.para;
  h.textContent = '';
  h.setAttribute('aria-label', txt);
  [...txt].forEach((c,i) => {
    const sp = document.createElement('span');
    sp.className = 'ch'; sp.style.setProperty('--i', i);
    sp.textContent = c === ' ' ? '\u00a0' : c;
    sp.setAttribute('aria-hidden','true');
    h.appendChild(sp);
  });
})();

// Aparición suave al hacer scroll
(function(){
  const els = document.querySelectorAll('#page section:not(:first-child) > *, .pol');
  els.forEach((el,i) => { el.classList.add('rv'); if(el.classList.contains('pol')) el.style.setProperty('--d', ((i%2)*0.2)+'s'); });
  if(!('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:0,rootMargin:'0px 0px -8% 0px'});
  els.forEach(e => io.observe(e));
})();

function tick(){
  const d = Math.max(0, Date.now() - new Date(CONFIG.desde).getTime());
  const v = [[Math.floor(d/864e5),'días'],[Math.floor(d/36e5)%24,'horas'],[Math.floor(d/6e4)%60,'min'],[Math.floor(d/1e3)%60,'seg']];
  document.getElementById('counter').innerHTML = v.map(x => '<div class="box"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('');
}
tick(); setInterval(tick, 1000);

function petals(){
  const cols = ['#6f9fb3','#4f7f93','#9fc0cc','#5d8b5a'];
  for(let i=0;i<16;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random()*100 + 'vw';
    p.style.background = cols[i%cols.length];
    p.style.animationDuration = (7 + Math.random()*7) + 's';
    p.style.animationDelay = (Math.random()*8) + 's';
    p.style.transform = 'scale(' + (0.7 + Math.random()*0.8) + ')';
    document.body.appendChild(p);
  }
}

function hearts(){
  const cols = ['#c8283f','#e0182f','#e3a1b1','#b4435a','#f3c9d3'];
  for(let i=0;i<22;i++){
    const h = document.createElement('div');
    h.className = 'hrt';
    h.style.left = (Math.random()*96) + 'vw';
    h.style.animationDuration = (9 + Math.random()*8) + 's';
    h.style.animationDelay = (Math.random()*7) + 's';
    const s = document.createElement('span');
    s.textContent = '\u2665';
    s.style.color = cols[i%cols.length];
    s.style.fontSize = (14 + Math.random()*22) + 'px';
    s.style.animationDelay = (Math.random()*1.3) + 's';
    h.appendChild(s);
    document.body.appendChild(h);
  }
}

const gate = document.getElementById('gate');
function open(){
  document.body.classList.remove('locked');
  document.body.classList.add('bloom');
  gate.classList.add('gone');
  setTimeout(petals, 900);
  setTimeout(hearts, 1500);
}
gate.addEventListener('click', open);
gate.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') open(); });

document.getElementById('btn').onclick = () => {
  document.getElementById('surprise').textContent = CONFIG.sorpresa;
};
</script>
